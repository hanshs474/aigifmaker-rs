[package]
name = "aigifmaker"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Official SDK for AI GIF Maker (aigifmaker.ai): turn text into animated GIFs."
license = "MIT"
readme = "README.md"
homepage = "https://aigifmaker.ai/?utm_source=crates&utm_medium=package"
repository = "https://github.com/hanshs474/aigifmaker-rs"
documentation = "https://docs.rs/aigifmaker"
keywords = ["gif", "gif-generator", "text-to-gif", "ai", "animation"]
categories = ["api-bindings", "multimedia::images"]
exclude = [".github/"]

[dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
